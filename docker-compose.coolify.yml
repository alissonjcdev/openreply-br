# OpenReply no Coolify.
# web + worker + cron saem da mesma imagem (Dockerfile do repo); Postgres e
# Redis são próprios desta stack, não compartilham nada com hoqvox/keys2fa.

x-app-env: &app-env
  NODE_ENV: production
  NEXTAUTH_URL: ${NEXTAUTH_URL}
  AUTH_TRUST_HOST: "true"
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  CRON_SECRET: ${CRON_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  DATABASE_URL: postgresql://openreply:${POSTGRES_PASSWORD}@postgres:5432/openreply
  REDIS_URL: redis://redis:6379
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_SERVER: ${EMAIL_SERVER:-}
  EMAIL_FROM: ${EMAIL_FROM}
  ALLOWED_EMAILS: ${ALLOWED_EMAILS}
  META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
  INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
  INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
  FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
  WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}

services:
  web:
    build: .
    restart: unless-stopped
    # Migração na subida: no build o banco não está na rede.
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    expose:
      - "3000"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /api/health responde 503 sem worker; aqui só interessa o Next de pé.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment: *app-env
    depends_on:
      web:
        condition: service_healthy

  cron:
    build: .
    restart: unless-stopped
    command: ["sh", "scripts/cron.sh"]
    environment:
      CRON_BASE_URL: http://web:3000
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      web:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: openreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - openreply-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreply -d openreply"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ exige noeviction; AOF para a fila sobreviver a restart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - openreply-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openreply-pg:
  openreply-redis:
